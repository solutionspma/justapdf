<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just a PDF</title>
  <link rel="icon" type="image/png" href="/assets/branding/logo/just-a-pdf-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener("error", (e) => {
      document.body.innerHTML =
        "<pre style='padding:16px'>" + e.message + "</pre>";
    });
    window.addEventListener("unhandledrejection", (e) => {
      const message = e.reason?.message || e.reason || "Unhandled promise rejection";
      document.body.innerHTML =
        "<pre style='padding:16px'>" + message + "</pre>";
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
